# Упрощённый GitLab CI/CD Pipeline для Medusa Backend
# Загружает образы на GitHub Container Registry (ghcr.io)

stages:
  - test
  - build

variables:
  DOCKER_IMAGE_NAME: ghcr.io/$GITHUB_USERNAME/medusa-backend
  DOCKER_IMAGE_TAG: $CI_COMMIT_SHORT_SHA

# Тестирование
test:
  image: python:3.12-slim
  stage: test
  cache:
    paths:
      - .cache/pip
  script:
    - pip install --cache-dir .cache/pip --upgrade pip
    - pip install --cache-dir .cache/pip -r requirements.txt
    - pip install --cache-dir .cache/pip pytest pytest-asyncio httpx flake8 black
    - echo "Running tests..."
    - pytest tests/ -v
    - echo "Running code quality checks..."
    - black --check . || echo "Code formatting issues found"
    - flake8 . --max-line-length=88 --ignore=E203,W503 || echo "Linting issues found"
  only:
    - master
    - develop
    - merge_requests

# Сборка и загрузка Docker образа
build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo $GITHUB_TOKEN | docker login ghcr.io -u $GITHUB_USERNAME --password-stdin
  script:
    - echo "Building Docker image..."
    - docker build -t $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG .
    - docker build -t $DOCKER_IMAGE_NAME:latest .
    - echo "Pushing to GitHub Container Registry..."
    - docker push $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG
    - docker push $DOCKER_IMAGE_NAME:latest
    - echo "✅ Image pushed to ghcr.io successfully"
  only:
    - master
    - develop