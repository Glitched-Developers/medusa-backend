services:
  medusa:
    image: ghcr.io/shizamuru-dev/medusa-backend:latest
    # build: .
    container_name: medusa
    ports:
      - "8080:8080"  # Backend API
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - PORT=8080
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_TTL=2700
    volumes:
      - medusa_data:/app/data
      - medusa_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    networks:
      - medusa-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  redis:
    image: redis:7-alpine
    container_name: medusa-redis
    command: redis-server --appendonly yes
    volumes:
      - medusa_redis:/data
    restart: unless-stopped
    networks:
      - medusa-network

volumes:
  medusa_data:
  medusa_logs:
  medusa_redis:

networks:
  medusa-network:
    driver: bridge
