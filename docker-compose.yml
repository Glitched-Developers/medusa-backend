version: '3.8'

services:
  medusa-backend:
    # Для разработки - собираем локально
    build: .
    # Для продакшена - используем образ с ghcr.io
    # image: ghcr.io/shizamuru-dev/medusa-backend:latest
    container_name: medusa-backend
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PORT=8000
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3