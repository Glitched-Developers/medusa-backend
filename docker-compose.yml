services:
  medusa-backend:
    #image: ghcr.io/shizamuru-dev/medusa-backend:latest
    # if need build from source
    build: .
    container_name: medusa-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    volumes:
      - medusa_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - medusa-network

  medusa-dashboard:
    build: 
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: medusa-dashboard
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - API_BASE_URL=http://medusa-backend:8080
    depends_on:
      medusa-backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - medusa-network

volumes:
  medusa_data:

networks:
  medusa-network:
    driver: bridge