services:
  medusa:
    image: ghcr.io/shizamuru-dev/medusa-backend:latest
    # build: .
    container_name: medusa
    ports:
      - "8080:8080"  # Backend API
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./data/Schedules.db}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_TTL=2700
      - SCHEDULE_UPDATE_INTERVAL_MINUTES=${SCHEDULE_UPDATE_INTERVAL_MINUTES:-90}
      - SCHEDULE_FRESHNESS_MINUTES=${SCHEDULE_FRESHNESS_MINUTES:-45}
      - BSU_RETRIES=${BSU_RETRIES:-3}
      - BSU_RETRY_DELAY=${BSU_RETRY_DELAY:-1}
      - BSU_TIMEOUT=${BSU_TIMEOUT:-10}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false
    volumes:
      - medusa_data:/app/data
      - medusa_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    networks:
      - medusa-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  redis:
    image: redis:7-alpine
    container_name: medusa-redis
    command: redis-server --appendonly yes
    volumes:
      - medusa_redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medusa-network

  postgres:
    image: postgres:16-alpine
    container_name: medusa-postgres
    profiles:
      - postgres
    environment:
      POSTGRES_DB: medusa
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
    volumes:
      - medusa_postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d medusa"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medusa-network

volumes:
  medusa_data:
  medusa_logs:
  medusa_redis:
  medusa_postgres:

networks:
  medusa-network:
    driver: bridge
