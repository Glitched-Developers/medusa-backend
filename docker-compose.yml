services:
  medusa:
    image: ghcr.io/shizamuru-dev/medusa-backend:latest
    # if need build from source
    #build: .
    container_name: medusa
    ports:
      - "8080:8080"  # Backend API
    environment:
      - PORT=8080
    volumes:
      - medusa_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    networks:
      - medusa-network

volumes:
  medusa_data:

networks:
  medusa-network:
    driver: bridge