services:
  medusa:
    image: ghcr.io/shizamuru-dev/medusa-backend:latest
    # if need build from source
    #build: .
    container_name: medusa
    ports:
      - "8080:8080"  # Backend API
      - "3000:3000"  # Dashboard
    environment:
      - PORT=8080
      - DASHBOARD_PORT=3000
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - medusa_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/docs", "&&", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    networks:
      - medusa-network

volumes:
  medusa_data:

networks:
  medusa-network:
    driver: bridge