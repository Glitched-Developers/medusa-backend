services:
  api:
    image: ghcr.io/shizamuru-dev/medusa-backend:latest
    # build: .
    container_name: medusa
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///./data/Schedules.db}
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_TTL: "2700"
      SCHEDULE_UPDATE_INTERVAL_MINUTES: ${SCHEDULE_UPDATE_INTERVAL_MINUTES:-90}
      SCHEDULE_FRESHNESS_MINUTES: ${SCHEDULE_FRESHNESS_MINUTES:-45}
      BSU_RETRIES: ${BSU_RETRIES:-3}
      BSU_RETRY_DELAY: ${BSU_RETRY_DELAY:-1}
      BSU_TIMEOUT: ${BSU_TIMEOUT:-10}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?ADMIN_API_TOKEN must be set}
      ADMIN_REFRESH_RATE_LIMIT: ${ADMIN_REFRESH_RATE_LIMIT:-5}
      ADMIN_REFRESH_RATE_WINDOW_SECONDS: ${ADMIN_REFRESH_RATE_WINDOW_SECONDS:-60}
      SCHEDULE_UPDATER_ENABLED: ${SCHEDULE_UPDATER_ENABLED:-true}
      FERNET_SECRET_KEY: ${FERNET_SECRET_KEY:?FERNET_SECRET_KEY must be set}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false
    volumes:
      - medusa_data:/app/data
      - medusa_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    networks:
      - medusa-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  worker:
    image: ghcr.io/shizamuru-dev/medusa-backend:latest
    container_name: medusa-worker
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///./data/Schedules.db}
      REDIS_URL: redis://redis:6379/0
      MAIL_POLL_INTERVAL_SEC: ${MAIL_POLL_INTERVAL_SEC:-30}
      FERNET_SECRET_KEY: ${FERNET_SECRET_KEY:?FERNET_SECRET_KEY must be set}
      GOOGLE_APPLICATION_CREDENTIALS: /app/firebase-key.json
    volumes:
      - medusa_data:/app/data
      - medusa_logs:/app/logs
      - ${FIREBASE_KEY_PATH:?FIREBASE_KEY_PATH must be set}:/app/firebase-key.json:ro
    entrypoint: ["/app/.venv/bin/python"]
    command: ["worker.py"]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - medusa-network

  redis:
    image: redis:7-alpine
    container_name: medusa-redis
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - medusa_redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medusa-network

  postgres:
    image: postgres:16-alpine
    container_name: medusa-postgres
    profiles:
      - postgres
    environment:
      POSTGRES_DB: medusa
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
    volumes:
      - medusa_postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d medusa"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medusa-network

volumes:
  medusa_data:
  medusa_logs:
  medusa_redis:
  medusa_postgres:

networks:
  medusa-network:
    driver: bridge
